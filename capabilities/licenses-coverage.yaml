naftiko: 1.0.0-alpha2
info:
  label: 'SAM: Licenses — Coverage'
  description: 'SAM: Licenses — Coverage. 3 operations. Lead operation: Get Extended Coverages. Self-contained Naftiko capability
    covering one Snow Software business surface.'
  tags:
  - Snow Software
  - Coverage
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SNOW_SOFTWARE_API_KEY: SNOW_SOFTWARE_API_KEY
capability:
  consumes:
  - type: http
    namespace: licenses-coverage
    baseUri: https://{region}.snowsoftware.io
    description: 'SAM: Licenses — Coverage business capability. Self-contained, no shared references.'
    resources:
    - name: api-sam-v1-extended-coverage
      path: /api/sam/v1/extended-coverage
      operations:
      - name: getlicenseextendedcoveragecollection
        method: GET
        description: Get Extended Coverages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: For more information on the available operators and which data types those operators work on, see [Filter
            API call results](https://docs.snowsoftware.io/snow-at
        - name: page_number
          in: query
          type: integer
          description: The page number.
        - name: page_size
          in: query
          type: integer
          description: The maximum number of items in the response.
    - name: api-sam-v1-extended-coverage-coverageId
      path: /api/sam/v1/extended-coverage/{coverageId}
      operations:
      - name: getlicenseextendedcoveragedetails
        method: GET
        description: Get Extended Coverage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: coverageId
          in: path
          type: string
          description: The unique ID of the coverage.
          required: true
    - name: api-sam-v1-licenses-extended-coverage-types
      path: /api/sam/v1/licenses-extended-coverage-types
      operations:
      - name: getextendedcoveragetypecollection
        method: GET
        description: Get Licenses Extended Coverage Types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: For more information on the available operators and which data types those operators work on, see [Filter
            API call results](https://docs.snowsoftware.io/snow-at
        - name: page_number
          in: query
          type: integer
          description: The page number.
        - name: page_size
          in: query
          type: integer
          description: The maximum number of items in the response.
    authentication:
      type: bearer
      token: '{{env.SNOW_SOFTWARE_API_KEY}}'
  exposes:
  - type: rest
    namespace: licenses-coverage-rest
    port: 8080
    description: 'REST adapter for SAM: Licenses — Coverage. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.'
    resources:
    - path: /v1/api/sam/v1/extended-coverage
      name: api-sam-v1-extended-coverage
      description: REST surface for api-sam-v1-extended-coverage.
      operations:
      - method: GET
        name: getlicenseextendedcoveragecollection
        description: Get Extended Coverages
        call: licenses-coverage.getlicenseextendedcoveragecollection
        with:
          filter: rest.filter
          page_number: rest.page_number
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/sam/v1/extended-coverage/{coverageid}
      name: api-sam-v1-extended-coverage-coverageid
      description: REST surface for api-sam-v1-extended-coverage-coverageId.
      operations:
      - method: GET
        name: getlicenseextendedcoveragedetails
        description: Get Extended Coverage
        call: licenses-coverage.getlicenseextendedcoveragedetails
        with:
          coverageId: rest.coverageId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/sam/v1/licenses-extended-coverage-types
      name: api-sam-v1-licenses-extended-coverage-types
      description: REST surface for api-sam-v1-licenses-extended-coverage-types.
      operations:
      - method: GET
        name: getextendedcoveragetypecollection
        description: Get Licenses Extended Coverage Types
        call: licenses-coverage.getextendedcoveragetypecollection
        with:
          filter: rest.filter
          page_number: rest.page_number
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: licenses-coverage-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for SAM: Licenses — Coverage. One tool per consumed operation, routed inline through this capability''s
      consumes block.'
    tools:
    - name: get-extended-coverages
      description: Get Extended Coverages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: licenses-coverage.getlicenseextendedcoveragecollection
      with:
        filter: tools.filter
        page_number: tools.page_number
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
    - name: get-extended-coverage
      description: Get Extended Coverage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: licenses-coverage.getlicenseextendedcoveragedetails
      with:
        coverageId: tools.coverageId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-licenses-extended-coverage-types
      description: Get Licenses Extended Coverage Types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: licenses-coverage.getextendedcoveragetypecollection
      with:
        filter: tools.filter
        page_number: tools.page_number
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
