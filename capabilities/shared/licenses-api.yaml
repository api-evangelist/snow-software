naftiko: "1.0.0-alpha1"

info:
  label: "Snow Atlas SAM Licenses API"
  description: >-
    The Snow Atlas SAM Licenses API provides programmatic access to software
    license data including license upgrades, application license transfers,
    computer license tracking, license policies, and maintenance periods.
  tags:
    - IT Asset Management
    - License Management
    - Snow Software
    - Software Asset Management
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SNOW_ACCESS_TOKEN: SNOW_ACCESS_TOKEN
      SNOW_REGION: SNOW_REGION

capability:
  consumes:
    - type: http
      namespace: snow-licenses
      baseUri: https://{{SNOW_REGION}}.snowsoftware.io
      description: "Snow Atlas SAM Licenses API for software license management"
      authentication:
        type: bearer
        token: "{{SNOW_ACCESS_TOKEN}}"
      resources:
        - name: license-upgrades
          path: /api/sam/v1/licenses/{id}/upgrades
          description: "Get upgrade options for a license"
          operations:
            - name: get-license-upgrades
              method: GET
              description: "Get License Upgrades"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "License ID"
                - name: page_number
                  in: query
                  type: integer
                  required: false
                  description: "Page number for pagination"
                - name: page_size
                  in: query
                  type: integer
                  required: false
                  description: "Maximum items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: license-policies
          path: /api/sam/v1/licenses/policies
          description: "List license policies"
          operations:
            - name: get-license-policies
              method: GET
              description: "Get License Policies"
              inputParameters:
                - name: page_number
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: page_size
                  in: query
                  type: integer
                  required: false
                  description: "Page size"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: computer-license-tracking
          path: /api/sam/v1/licenses/{id}/computers/tracking
          description: "Track license usage per computer"
          operations:
            - name: get-computer-license-tracking
              method: GET
              description: "Get Computer License Tracking"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "License ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: snow-licenses-api
      resources:
        - path: /v1/licenses/{id}/upgrades
          name: license-upgrades
          description: "Get upgrade options for a software license"
          operations:
            - method: GET
              name: get-license-upgrades
              description: "Get License Upgrades"
              call: "snow-licenses.get-license-upgrades"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: snow-licenses-mcp
      transport: http
      tools:
        - name: get-license-upgrades
          description: "Get available upgrade options for a Snow Atlas software license"
          hints:
            readOnly: true
            openWorld: false
          call: "snow-licenses.get-license-upgrades"
          with:
            id: "tools.license_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-license-policies
          description: "Get all license policies configured in Snow Atlas"
          hints:
            readOnly: true
            openWorld: false
          call: "snow-licenses.get-license-policies"
          outputParameters:
            - type: object
              mapping: "$."
