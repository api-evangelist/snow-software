naftiko: 1.0.0-alpha2
info:
  label: 'SAM: Licenses — Costs'
  description: 'SAM: Licenses — Costs. 3 operations. Lead operation: Get License Costs. Self-contained Naftiko capability
    covering one Snow Software business surface.'
  tags:
  - Snow Software
  - Costs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SNOW_SOFTWARE_API_KEY: SNOW_SOFTWARE_API_KEY
capability:
  consumes:
  - type: http
    namespace: licenses-costs
    baseUri: https://{region}.snowsoftware.io
    description: 'SAM: Licenses — Costs business capability. Self-contained, no shared references.'
    resources:
    - name: api-sam-v1-licenses-id-costs
      path: /api/sam/v1/licenses/{id}/costs
      operations:
      - name: getlicensecostcollection
        method: GET
        description: Get License Costs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The unique ID of the license.
          required: true
        - name: filter
          in: query
          type: string
          description: For more information on the available operators and which data types those operators work on, see [Filter
            API call results](https://docs.snowsoftware.io/snow-at
        - name: page_number
          in: query
          type: integer
          description: The page number.
        - name: page_size
          in: query
          type: integer
          description: The maximum number of items in the response.
    - name: api-sam-v1-licenses-id-costs-summary
      path: /api/sam/v1/licenses/{id}/costs-summary
      operations:
      - name: getlicensecostsummary
        method: GET
        description: Get a License Costs Summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The unique ID of the license.
          required: true
    - name: api-sam-v1-licenses-id-costs-organizationId
      path: /api/sam/v1/licenses/{id}/costs/{organizationId}
      operations:
      - name: getlicensecost
        method: GET
        description: Get a License Costs for an Organization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The unique ID of the license.
          required: true
        - name: organizationId
          in: path
          type: string
          description: The unique ID of the organization.
          required: true
    authentication:
      type: bearer
      token: '{{env.SNOW_SOFTWARE_API_KEY}}'
  exposes:
  - type: rest
    namespace: licenses-costs-rest
    port: 8080
    description: 'REST adapter for SAM: Licenses — Costs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.'
    resources:
    - path: /v1/api/sam/v1/licenses/{id}/costs
      name: api-sam-v1-licenses-id-costs
      description: REST surface for api-sam-v1-licenses-id-costs.
      operations:
      - method: GET
        name: getlicensecostcollection
        description: Get License Costs
        call: licenses-costs.getlicensecostcollection
        with:
          id: rest.id
          filter: rest.filter
          page_number: rest.page_number
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/sam/v1/licenses/{id}/costs-summary
      name: api-sam-v1-licenses-id-costs-summary
      description: REST surface for api-sam-v1-licenses-id-costs-summary.
      operations:
      - method: GET
        name: getlicensecostsummary
        description: Get a License Costs Summary
        call: licenses-costs.getlicensecostsummary
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/sam/v1/licenses/{id}/costs/{organizationid}
      name: api-sam-v1-licenses-id-costs-organizationid
      description: REST surface for api-sam-v1-licenses-id-costs-organizationId.
      operations:
      - method: GET
        name: getlicensecost
        description: Get a License Costs for an Organization
        call: licenses-costs.getlicensecost
        with:
          id: rest.id
          organizationId: rest.organizationId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: licenses-costs-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for SAM: Licenses — Costs. One tool per consumed operation, routed inline through this capability''s
      consumes block.'
    tools:
    - name: get-license-costs
      description: Get License Costs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: licenses-costs.getlicensecostcollection
      with:
        id: tools.id
        filter: tools.filter
        page_number: tools.page_number
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
    - name: get-license-costs-summary
      description: Get a License Costs Summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: licenses-costs.getlicensecostsummary
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-license-costs-organization
      description: Get a License Costs for an Organization
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: licenses-costs.getlicensecost
      with:
        id: tools.id
        organizationId: tools.organizationId
      outputParameters:
      - type: object
        mapping: $.
