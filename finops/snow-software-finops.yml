principles:
  - name: Visibility
    description: Use Snow Atlas dashboards to surface installed software, SaaS subscriptions, and entitlement
      gaps per business unit.
  - name: Allocation
    description: Tag each managed asset / SaaS application to a cost center and contract to enable chargeback
      and renewal-by-owner.
  - name: Optimization
    description: Reclaim unused SaaS seats, true-down over-licensed software, and consolidate redundant
      applications surfaced by Snow Risk Monitor and the SaaS Management module.
  - name: Accountability
    description: Snow Atlas administrators review entitlement-vs-installed deltas and SaaS usage at each
      renewal cycle with finance and procurement.
