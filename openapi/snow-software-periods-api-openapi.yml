          format: int32
          example: 5
        total_items:
          type:
          - integer
          - 'null'
          description: The total number of items.
          format: int32
          example: 100
    CreatedHateoasResponse:
      allOf:
      - $ref: '#/components/schemas/HateoasResponse'
