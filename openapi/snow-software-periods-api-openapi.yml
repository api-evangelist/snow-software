    HateoasCollectionOfMaintenancePeriodCollection:
      allOf:
      - $ref: '#/components/schemas/FilteredResponseOfMaintenancePeriodCollection'
      - type: object
        additionalProperties: false
        required:
        - _links
        properties:
          _links:
            type: array
            description: A collection of links to related resources.
            items:
              $ref: '#/components/schemas/Link'
    MaintenancePeriodRequest:
      type: object
      additionalProperties: false
      properties:
        agreementPeriodId:
          type:
          - string
          - 'null'
          description: The unique ID of the agreement period.
          format: guid
          example: 49cdd99f-bc16-40f9-ad40-48f12182fb30
        validFrom:
          type:
          - string
          - 'null'
          description: The valid form date.
          format: date-time
          example: '2024-01-01T00:00:00Z'
        validTo:
          type:
          - string
          - 'null'
          description: The valid to date.
          format: date-time
          example: '2025-01-01T00:00:00Z'
        hasUpgradeRights:
          type: boolean
          description: '```true``` if has upgrade rights; otherwise, ```false```.'
          example: true
        invoiceReference:
          type:
          - string
          - 'null'
          description: The invoice reference.
          example: INV12345
        notes:
          type:
          - string
          - 'null'
          description: The notes.
          example: Notes
        maintenanceCost:
          type:
          - number
          - 'null'
          description: The maintenance cost.
          format: decimal
          example: 1000
        supportCost:
          type:
          - number
          - 'null'
          description: The support cost.
          format: decimal
          example: 1000
    Error:
      description: The error details.
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: The HTTP status code.
        message:
          type: string
          description: The error message.
    FilteredResponseOfMaintenancePeriodCollection:
      type: object
      description: Filtered response.
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          description: A collection of items.
          items:
            $ref: '#/components/schemas/MaintenancePeriodCollection'
        pagination:
          description: The pagination details.
          oneOf:
          - $ref: '#/components/schemas/Pagination'
