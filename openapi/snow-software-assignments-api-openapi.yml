openapi: 3.0.3
info:
  title: 'SAM: Computers Applications Assignments API'
  description: API for interacting with computers.
  contact:
    name: Flexera
    url: https://www.flexera.com
  version: 1.0.0
servers:
- url: https://{region}.snowsoftware.io
  variables:
