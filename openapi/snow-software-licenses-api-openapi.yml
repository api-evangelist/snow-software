        subscriptionValidFrom:
          type:
          - string
          - 'null'
          description: The subscription valid from date.
          format: date-time
          example: '2024-01-01T00:00:00Z'
        subscriptionValidTo:
          type:
          - string
          - 'null'
          description: The subscription valid to date.
          format: date-time
          example: '2025-01-01T00:00:00Z'
        vendor:
          type:
          - string
          - 'null'
          description: The vendor.
          example: Microsoft
        upgrades:
          type:
          - array
          - 'null'
