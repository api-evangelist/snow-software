aid: snow-software
name: Snow Software
description: >-
  Snow Software (now Flexera Snow) is an IT asset and SaaS management platform providing visibility into software
  licenses, cloud spend, SaaS usage, and hardware assets across the enterprise. Snow Atlas is the cloud-native platform
  offering SAM (Software Asset Management), SaaS Management, Cloud License Management, and Commander for hybrid IT. The
  Snow Atlas REST APIs enable programmatic access to licenses, computers, SaaS applications, subscriptions, user
  accounts, agreements, and audit logs.
type: Index
accessModel:
  pricing: enterprise
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Enterprise · Self-serve signup
  confidence: high
